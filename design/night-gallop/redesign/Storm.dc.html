<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Saira:wght@500;600;700&display=swap">
  <style>
    body { margin: 0; background: #0b1220; }
    a { color: #facc15; } a:hover { color: #e2e8f0; }
  </style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#0b1220;font-family:'Saira','Helvetica Neue',Arial,sans-serif;color:#e2e8f0">
  <canvas id="scene" width="780" height="1688" style="position:absolute;left:0;top:0;width:390px;height:844px;display:block"></canvas>
  <div style="position:absolute;left:0;right:0;top:0;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 4px;background:linear-gradient(180deg, rgba(0,0,0,.7), rgba(0,0,0,0));font-size:12px">
    <div style="display:flex;align-items:center;gap:2px">
      <div style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6"></path><path d="M12 7.5v.01"></path></svg></div>
      <span style="font-weight:600">Rules</span>
    </div>
    <div style="display:flex;align-items:center;gap:18px">
      <div style="display:flex;flex-direction:column;align-items:flex-end;line-height:1.2"><span style="font-size:10px;letter-spacing:.12em;opacity:.7">SESSION</span><span style="font-weight:700;font-variant-numeric:tabular-nums">{{clock}}</span></div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;line-height:1.2"><span style="font-size:10px;letter-spacing:.12em;opacity:.7">NET</span><span style="font-weight:700;font-variant-numeric:tabular-nums">{{net}}</span></div>
    </div>
  </div>
  <div style="position:absolute;left:26px;top:208px;font-family:'Saira',sans-serif;font-size:12px;font-weight:700;letter-spacing:.22em;color:rgba(226,232,240,.75)">NIGHT GALLOP · {{race}}</div>
  <sc-if value="{{multShow}}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;left:22px;right:0;top:70px;display:flex;justify-content:flex-start">
      <div style="display:flex;align-items:baseline;font-family:'Saira Condensed','Arial Narrow',sans-serif;font-size:124px;font-weight:800;line-height:1;letter-spacing:-2px;color:#facc15;text-shadow:0 4px 30px rgba(0,0,0,.6);opacity:{{multOpacity}};transform:scale({{multScale}});font-variant-numeric:tabular-nums">
        <span style="font-size:62px;margin-right:2px">x</span><span>{{mult}}</span>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{showBanner}}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:24px;right:24px;top:300px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 16px;background:{{bannerBg}};color:{{bannerFg}};border-radius:2px">
      <span style="font-family:'Saira Condensed','Arial Narrow',sans-serif;font-size:44px;line-height:1;font-weight:900">{{banner}}</span>
      <span style="font-size:14px;font-weight:600">{{bannerSub}}</span>
    </div>
  </sc-if>
  <div style="position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:12px;padding:34px 16px 18px;background:linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.85) 30%)">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div style="display:flex;align-items:center;gap:8px">
        <div style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1.5px solid rgba(255,255,255,.35);border-radius:2px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 12h12"></path></svg></div>
        <div style="display:flex;flex-direction:column;align-items:center;min-width:76px;line-height:1.15"><span style="font-size:10px;letter-spacing:.12em;opacity:.7">STAKE</span><span style="font-size:18px;font-weight:700">₦500</span></div>
        <div style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1.5px solid rgba(255,255,255,.35);border-radius:2px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 12h12"></path><path d="M12 6v12"></path></svg></div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;line-height:1.15"><span style="font-size:10px;letter-spacing:.12em;opacity:.7">AUTO COLLECT</span><span style="font-size:15px;font-weight:700">Off</span></div>
    </div>
    <div style="height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:{{btnBg}};color:{{btnFg}};border-radius:2px">
      <span style="font-family:'Saira Condensed','Arial Narrow',sans-serif;font-size:24px;line-height:1;font-weight:900;font-variant-numeric:tabular-nums">{{btnTop}}</span>
      <span style="font-size:12px;font-weight:600;opacity:.85">{{btnSub}}</span>
    </div>
    <span style="font-size:11px;text-align:center;opacity:.6">18+ · RTP 97% · Result fixed when the round starts</span>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844},"reducedMotion":{"editor":"boolean","default":false}}'>
class Component extends DCLogic {
  cfg() {
    return {
      horseX: 360, crashStops: true,
      rounds: [{ collectAt: 5.1 }, { crashAt: 3.0 }, { crashAt: 4.4 }],
      hud: { accent: '#facc15', onAccent: '#111302', idleBg: 'rgba(250,204,21,.1)', idleFg: '#fef08a', lossBg: 'rgba(6,9,14,.92)', lossFg: '#e2e8f0' },
    };
  }

  drawScene(ctx, S) {
    const W = S.W, H = S.H, G = 1230, k = S.k, L = S.light;
    let gr = ctx.createLinearGradient(0, 0, 0, 1100);
    gr.addColorStop(0, '#0b1220'); gr.addColorStop(1, '#27313f');
    ctx.fillStyle = gr; ctx.fillRect(-40, -40, W + 80, H + 80);
    // Lightning only when the value passes x2, x5 and x10 (a punch), so it follows the value, never the crash.
    if (S.punch > 0.6 && L > 0.5) {
      ctx.fillStyle = 'rgba(220,235,255,' + (S.punch - 0.6) * 1.6 + ')'; ctx.fillRect(-40, -40, W + 80, H + 80);
      ctx.strokeStyle = 'rgba(240,248,255,.9)'; ctx.lineWidth = 4; ctx.beginPath();
      let x = 150 + this.rnd(Math.floor(S.t)) * 480, y = 0; ctx.moveTo(x, y);
      while (y < 700) { x += (this.rnd(y + S.t) - 0.5) * 90; y += 60; ctx.lineTo(x, y); }
      ctx.stroke();
    }
    // floodlight towers in rain haze
    this.tile(S, 0.2, 360, (x) => {
      ctx.fillStyle = '#1a2230'; ctx.fillRect(x + 40, 330, 12, 720);
      ctx.fillStyle = L > 0.5 ? '#fffbe6' : '#3b4252'; ctx.fillRect(x, 300, 92, 34);
      const hg = ctx.createRadialGradient(x + 46, 316, 6, x + 46, 316, 220);
      hg.addColorStop(0, 'rgba(255,250,220,' + (0.6 * L) + ')'); hg.addColorStop(1, 'rgba(255,250,220,0)');
      ctx.fillStyle = hg; ctx.fillRect(x - 180, 100, 460, 440);
    });
    ctx.fillStyle = '#141b26'; ctx.fillRect(-40, 960, W + 80, 110);
    ctx.fillStyle = '#e2e8f0'; ctx.fillRect(-40, 1066, W + 80, 9);
    this.tile(S, 1, 100, (x) => { ctx.fillRect(x, 1066, 7, 55); });
    // wet track with light reflections
    gr = ctx.createLinearGradient(0, 1120, 0, H);
    gr.addColorStop(0, '#3a3530'); gr.addColorStop(1, '#0d0f12');
    ctx.fillStyle = gr; ctx.fillRect(-40, 1121, W + 80, H);
    this.tile(S, 0.2, 360, (x) => {
      const rg = ctx.createLinearGradient(0, 1130, 0, 1600);
      rg.addColorStop(0, 'rgba(255,250,220,' + (0.25 * L) + ')'); rg.addColorStop(1, 'rgba(255,250,220,0)');
      ctx.fillStyle = rg; ctx.fillRect(x + 20, 1130, 50, 470);
    });
    this.speedLines(ctx, S, '#cbd5e1', 20, 1140, 1640, 170);
    const hv = this.horse(ctx, S, { body: '#10151c', far: '#0a0e13', mane: '#05070a', rim: '#e2e8f0', silk1: '#facc15', silk2: '#111302', cap: '#111302', skin: '#3e271b', breeches: '#e2e8f0' }, G, 2.5);
    this.kick(S, hv, G, 50 + 100 * k, { n: S.reduced ? 1 : 4, color: '#c7d2de', alpha: 0.8, r: 4, life: 0.7, spread: 320, lift: 700 + 500 * k, vx: -160, grav: 1700, world: 0.6 });
    this.drawParts(ctx, S);
    // rain: slant and speed grow with the value
    const drops = S.reduced ? 40 : 120 + Math.floor(160 * k);
    ctx.strokeStyle = 'rgba(200,215,235,.35)'; ctx.lineWidth = 2; ctx.beginPath();
    for (let i = 0; i < drops; i++) {
      const sp = 1600 + 1200 * k;
      const y = ((this.rnd(i) * H + S.t * sp) % (H + 200)) - 100;
      const x = ((this.rnd(i * 3) * (W + 400) - S.scroll * 0.9 - y * (0.2 + 0.5 * k)) % (W + 400) + (W + 400)) % (W + 400) - 200;
      ctx.moveTo(x, y); ctx.lineTo(x - 18 - 50 * k, y + 40);
    }
    ctx.stroke();
    if (L < 1) { ctx.fillStyle = 'rgba(0,0,3,' + (0.94 * (1 - L)) + ')'; ctx.fillRect(-40, -40, W + 80, H + 80); }
  }

  componentDidMount() {
    const c = this.cfg();
    this.g = {
      round: 0, phase: 'bet', pt: 0, t: 0, mult: 1, k: 0, speed: 0, hs: 0, gait: 0, scroll: 0,
      parts: [], flash: 0, burst: 0, punch: 0, lastPunch: 1, net: 0, clock: 1394, hudT: 1,
      hx: c.horseX || 370, raceNo: 41, frozen: false, cash: 0, lightsT: 0,
    };
    this.last = 0;
    this.hudKey = '';
    const step = (now) => {
      this.raf = requestAnimationFrame(step);
      if (!this.cv || !this.cv.isConnected) this.cv = document.getElementById('scene');
      if (!this.cv) return;
      const dt = this.last ? Math.min(0.05, (now - this.last) / 1000) : 0.016;
      this.last = now;
      this.tick(dt);
      this.paint(this.cv.getContext('2d'));
    };
    this.raf = requestAnimationFrame(step);
  }

  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
  }

  // The certified rising curve (whack-crash/v1-rising): r0 0.12, rmax 0.95, ramp 12 s.
  curve(t) {
    const r0 = 0.12, rmax = 0.95, ramp = 12;
    const k = t <= ramp ? r0 * t + ((rmax - r0) * t * t) / (2 * ramp) : r0 * ramp + ((rmax - r0) * ramp) / 2 + rmax * (t - ramp);
    return Math.exp(k);
  }

  naira(v) {
    return '₦' + Math.round(Math.abs(v)).toLocaleString('en-NG');
  }

  tick(dt) {
    const c = this.cfg();
    const g = this.g;
    const R = c.rounds;
    const r = R[g.round % R.length];
    const STAKE = 500, GAP = 2.6, RES = 1.9;
    g.t += dt; g.pt += dt; g.clock += dt;
    g.flash = Math.max(0, g.flash - dt * 2.4);
    g.burst = Math.max(0, g.burst - dt * 1.6);
    g.punch = Math.max(0, g.punch - dt * 2.2);
    if (g.phase === 'bet') {
      g.mult = 1;
      if (g.pt >= GAP) { g.phase = 'run'; g.pt = 0; g.net -= STAKE; g.raceNo++; g.burst = 1; g.lastPunch = 1; }
    } else if (g.phase === 'run') {
      g.mult = this.curve(g.pt);
      for (const th of [2, 5, 10]) if (g.mult >= th && g.lastPunch < th) { g.lastPunch = th; g.punch = 1; }
      if (r.collectAt && g.pt >= r.collectAt) {
        g.phase = 'collect'; g.pt = 0; g.cash = Math.round(g.mult * 100) / 100;
        g.net += Math.round(STAKE * g.cash); g.flash = this.props.reducedMotion ? 0.3 : 1;
      } else if (r.crashAt && g.pt >= r.crashAt) {
        g.phase = 'crash'; g.pt = 0;
      }
    } else if (g.pt >= RES) {
      g.phase = 'bet'; g.pt = 0; g.round++;
      if (g.round % R.length === 0) g.net = 0;
    }
    if (g.phase === 'run') g.k = Math.min(1, Math.log(g.mult) / Math.log(4));
    if (g.phase === 'bet') g.k = 0;
    g.frozen = g.phase === 'collect' && g.pt < 0.35;
    let target = 520, rate = 3;
    if (g.phase === 'run') { target = 1100 + 2600 * g.k + 900 * g.burst; rate = 6; }
    else if (g.phase === 'crash') { target = c.crashStops ? 0 : 1100 + 2600 * g.k; rate = 1.6; }
    if (g.frozen) { g.speed = 0; }
    else {
      g.speed += (target - g.speed) * Math.min(1, dt * rate);
      g.gait += dt * (1.3 + g.speed / 1400);
      g.scroll += g.speed * dt;
    }
    g.hs = g.speed;
    g.hudT += dt;
    if (g.hudT > 0.05) { g.hudT = 0; this.pushHud(); }
  }

  pushHud() {
    const g = this.g;
    const H = this.cfg().hud;
    const STAKE = 500;
    const n = {};
    const shown = g.phase === 'collect' ? g.cash : g.mult;
    n.mult = shown.toFixed(2);
    n.multShow = g.phase !== 'crash';
    n.multOpacity = g.phase === 'bet' ? 0.5 : 1;
    n.multScale = (1 + 0.08 * g.punch + 0.04 * g.burst).toFixed(3);
    n.race = 'ROUND ' + g.raceNo;
    const s = Math.floor(g.clock);
    n.clock = String(Math.floor(s / 3600)).padStart(2, '0') + ':' + String(Math.floor(s / 60) % 60).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    n.net = (g.net > 0 ? '+' : g.net < 0 ? '−' : '') + this.naira(g.net);
    n.showBanner = g.phase === 'crash' || g.phase === 'collect';
    n.bannerWin = false;
    if (g.phase === 'bet') {
      n.btnTop = 'BET ' + this.naira(STAKE);
      n.btnSub = 'Next round in ' + Math.max(1, Math.ceil(2.6 - g.pt)) + 's';
      n.btnBg = H.idleBg; n.btnFg = H.idleFg;
    } else if (g.phase === 'run') {
      n.btnTop = 'COLLECT ' + this.naira(STAKE * g.mult);
      n.btnSub = 'Stake ' + this.naira(STAKE);
      n.btnBg = H.accent; n.btnFg = H.onAccent;
    } else if (g.phase === 'crash') {
      n.btnTop = 'LIGHTS OUT';
      n.btnSub = 'Next round soon';
      n.btnBg = H.idleBg; n.btnFg = H.idleFg;
      n.banner = H.crashWord || 'LIGHTS OUT';
      n.bannerSub = 'Stake ' + this.naira(STAKE) + ' lost · Net −' + this.naira(STAKE);
    } else {
      const ret = Math.round(STAKE * g.cash);
      n.btnTop = 'COLLECTED';
      n.btnSub = this.naira(ret) + ' at x' + g.cash.toFixed(2);
      n.btnBg = H.idleBg; n.btnFg = H.idleFg;
      n.banner = 'WIN ' + this.naira(ret);
      n.bannerSub = 'Net +' + this.naira(ret - STAKE) + ' this round';
      n.bannerWin = true;
    }
    n.bannerBg = n.bannerWin ? H.accent : H.lossBg;
    n.bannerFg = n.bannerWin ? H.onAccent : H.lossFg;
    const key = JSON.stringify(n);
    if (key !== this.hudKey) { this.hudKey = key; this.setState(n); }
  }

  renderVals() {
    const H = this.cfg().hud;
    return Object.assign({
      mult: '1.00', multShow: true, multOpacity: 0.5, multScale: '1', race: 'ROUND 41', clock: '00:23:14', net: '₦0',
      btnTop: 'BET ₦500', btnSub: 'Next round in 3s', btnBg: H.idleBg, btnFg: H.idleFg,
      showBanner: false, banner: '', bannerSub: '', bannerBg: H.lossBg, bannerFg: H.lossFg,
    }, this.state || {});
  }

  // Lights: fully on while a round runs; they fail only after the crash and come back in the gap.
  lightLevel(S) {
    if (S.phase === 'crash') {
      const f = S.pt;
      if (f < 0.05) return 0.1;
      if (f < 0.1) return 0.85;
      if (f < 0.17) return 0.05;
      return 0.04;
    }
    return 1;
  }

  paint(ctx) {
    const g = this.g;
    const W = 780, H = 1688;
    const reduced = !!this.props.reducedMotion;
    const S = {
      W, H, t: g.t, dt: g.frozen ? 0 : Math.min(0.05, 1 / 60), phase: g.phase, pt: g.pt, mult: g.mult, k: g.k,
      speed: g.speed, hs: g.hs, scroll: g.scroll, gait: g.gait, hx: g.hx, reduced, frozen: g.frozen,
      burst: g.burst, punch: g.punch, flash: g.flash,
    };
    S.light = this.lightLevel(S);
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    if (!reduced && g.phase === 'run') {
      const a = g.k * 7 + g.burst * 10 + g.punch * 8;
      ctx.translate((Math.random() - 0.5) * a, (Math.random() - 0.5) * a);
    }
    // Zoom punches when the multiplier passes x2, x5, x10: tied to the value only.
    const z = 1 + 0.05 * g.k + 0.06 * g.punch;
    ctx.translate(W / 2, H * 0.55); ctx.scale(z, z); ctx.translate(-W / 2, -H * 0.55);
    this.drawScene(ctx, S);
    ctx.restore();
    if (g.flash > 0 && !this.cfg().ownFlash) {
      ctx.fillStyle = 'rgba(255,255,255,' + (g.flash * 0.75).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  speedLines(ctx, S, color, count, yMin, yMax, lenBase) {
    const n = Math.floor(count * (0.25 + S.k)) + (S.phase === 'run' ? Math.floor(S.burst * 12) : 0);
    ctx.fillStyle = color;
    for (let i = 0; i < n; i++) {
      const seed = i * 17.3;
      const y = yMin + this.rnd(seed) * (yMax - yMin);
      const len = lenBase * (0.5 + this.rnd(seed * 2)) * (0.6 + 1.6 * S.k);
      const x = ((this.rnd(seed * 3) * (S.W + len) - S.scroll * (1.6 + this.rnd(seed) * 1.4)) % (S.W + len) + (S.W + len)) % (S.W + len) - len;
      ctx.globalAlpha = 0.15 + 0.5 * this.rnd(seed * 5);
      ctx.fillRect(x, y, len, 2 + this.rnd(seed * 7) * 3);
    }
    ctx.globalAlpha = 1;
  }


  rnd(n) {
    const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }

  tile(S, f, sp, fn) {
    const off = S.scroll * f;
    const base = Math.floor(off / sp);
    const shift = off - base * sp;
    const count = Math.ceil(S.W / sp) + 2;
    for (let i = -1; i < count; i++) fn(i * sp - shift, base + i);
  }

  emit(x, y, n, o) {
    const P = this.g.parts;
    const cap = this.props.reducedMotion ? 120 : 320;
    for (let i = 0; i < n; i++) {
      if (P.length > cap) P.shift();
      P.push({
        x: x + (Math.random() - 0.5) * (o.jx || 20), y,
        vx: (o.vx || 0) + (Math.random() - 0.5) * (o.spread || 80),
        vy: (o.vy || 0) - Math.random() * (o.lift || 80),
        life: 0, max: (o.life || 1) * (0.6 + Math.random() * 0.8),
        r: (o.r || 10) * (0.5 + Math.random()), grow: o.grow || 0, grav: o.grav || 0,
        color: o.color, alpha: o.alpha == null ? 0.6 : o.alpha, world: o.world == null ? 1 : o.world,
        sq: !!o.square,
      });
    }
  }

  drawParts(ctx, S) {
    const P = this.g.parts;
    for (let i = P.length - 1; i >= 0; i--) {
      const p = P[i];
      if (S.dt > 0) {
        p.life += S.dt;
        p.vy += p.grav * S.dt;
        p.x += (p.vx - S.speed * p.world) * S.dt;
        p.y += p.vy * S.dt;
      }
      if (p.life >= p.max) { P.splice(i, 1); continue; }
      ctx.globalAlpha = Math.max(0, p.alpha * (1 - p.life / p.max));
      ctx.fillStyle = p.color;
      const rr = p.r + p.grow * p.life;
      if (p.sq) { ctx.fillRect(p.x - rr, p.y - rr, rr * 2, rr * 2); }
      else { ctx.beginPath(); ctx.arc(p.x, p.y, rr, 0, 6.2832); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
  }

  // Placeholder gallop: production art is pre-rendered 3D sprite sheets.
  horse(ctx, S, L, G, s, opt) {
    opt = opt || {};
    const TAU = Math.PI * 2;
    const p = S.gait;
    const run = Math.min(1, S.hs / 520);
    const bob = -Math.abs(Math.sin(TAU * p)) * 7 * run;
    const pitch = Math.sin(TAU * p + 0.8) * 0.045 * run;
    const upright = S.phase === 'run' ? 0 : S.phase === 'crash' ? 1 - Math.min(1, S.hs / 700) : S.phase === 'collect' ? 0.55 : 0.35;
    const hooves = [];
    ctx.save();
    ctx.translate(S.hx, G);
    if (opt.mirror) { ctx.scale(s, -s); ctx.globalAlpha = opt.alpha; }
    else ctx.scale(s, s);
    ctx.translate(0, bob);
    ctx.rotate(pitch);
    const amp = 0.18 + 0.5 * run;
    const leg = (hx, hy, ph, front, near) => {
      const th = TAU * (p + ph);
      const a = amp * Math.sin(th);
      const fold = Math.max(0, Math.cos(th)) * (front ? 1.5 : 1.0) * (0.3 + 0.7 * run);
      const kx = hx + Math.sin(a) * 36, ky = hy + Math.cos(a) * 36;
      const a2 = a - fold;
      const fx = kx + Math.sin(a2) * 40, fy = ky + Math.cos(a2) * 40;
      ctx.strokeStyle = near ? L.body : (L.far || L.body);
      ctx.lineCap = 'round';
      ctx.lineWidth = near ? (front ? 12 : 15) : (front ? 10 : 13);
      ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(kx, ky); ctx.stroke();
      ctx.lineWidth = near ? 7 : 6;
      ctx.beginPath(); ctx.moveTo(kx, ky); ctx.lineTo(fx, fy); ctx.stroke();
      ctx.fillStyle = L.hoof || L.body;
      ctx.beginPath(); ctx.arc(fx, fy + 1, 5, 0, TAU); ctx.fill();
      hooves.push([S.hx + s * fx, G + s * (fy + bob)]);
    };
    leg(-38, -74, 0.0, false, false);
    leg(40, -74, 0.44, true, false);
    // tail
    const tw = Math.sin(TAU * p) * 8 * run;
    ctx.strokeStyle = L.mane || L.body;
    ctx.lineCap = 'round';
    ctx.lineWidth = 10;
    ctx.beginPath(); ctx.moveTo(-60, -98); ctx.quadraticCurveTo(-98, -104 + tw, -128, -72 - run * 22 + tw); ctx.stroke();
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(-62, -94); ctx.quadraticCurveTo(-104, -94 + tw, -136, -58 - run * 16 + tw * 1.4); ctx.stroke();
    // body
    ctx.fillStyle = L.body;
    ctx.beginPath(); ctx.ellipse(0, -88, 60, 22, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-36, -92, 31, 27, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(38, -90, 29, 26, 0, 0, TAU); ctx.fill();
    // neck + head
    const r1 = -0.95 + 0.4 * run + Math.sin(TAU * p + 1.6) * 0.09 * run;
    const r2 = 0.95 - 0.25 * run;
    ctx.save();
    ctx.translate(46, -98);
    ctx.rotate(r1);
    ctx.beginPath(); ctx.moveTo(-8, -18); ctx.lineTo(62, -10); ctx.lineTo(66, 10); ctx.lineTo(-4, 24); ctx.closePath(); ctx.fill();
    if (L.mane) {
      ctx.strokeStyle = L.mane; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(-6, -18); ctx.quadraticCurveTo(30, -20 - 5 * run, 60, -12); ctx.stroke();
    }
    ctx.translate(62, 0);
    ctx.rotate(r2);
    ctx.beginPath(); ctx.ellipse(20, 0, 27, 11, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(42, 2, 9, 9, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, -8); ctx.lineTo(4, -24); ctx.lineTo(11, -9); ctx.closePath(); ctx.fill();
    ctx.restore();
    // mouth point in body frame, for the reins
    const c1 = Math.cos(r1), s1 = Math.sin(r1);
    const hx0 = 46 + 62 * c1, hy0 = -98 + 62 * s1;
    const c2 = Math.cos(r1 + r2), s2 = Math.sin(r1 + r2);
    const mouth = [hx0 + 40 * c2 - 3 * s2, hy0 + 40 * s2 + 3 * c2];
    if (L.rim && !opt.mirror) {
      ctx.strokeStyle = L.rim; ctx.lineWidth = 3; ctx.globalAlpha = 0.75;
      ctx.beginPath(); ctx.ellipse(0, -90, 60, 22, 0, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(-36, -94, 31, 27, 0, Math.PI * 1.1, Math.PI * 1.7); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    // jockey (adult proportions: small head, long torso, clear riding kit)
    const jb = -bob * 0.6;
    const hip = [4, -118 + jb];
    const sh = [40 - 22 * upright, -130 - 26 * upright + jb];
    const head = [sh[0] + 12 - 6 * upright, sh[1] - 11 - 3 * upright];
    const knee = [26, -106 + jb * 0.5];
    const foot = [16, -92];
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = L.breeches || '#f1ede4'; ctx.lineWidth = 11;
    ctx.beginPath(); ctx.moveTo(hip[0], hip[1]); ctx.lineTo(knee[0], knee[1]); ctx.stroke();
    ctx.strokeStyle = L.boot || '#141414'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(knee[0], knee[1]); ctx.lineTo(foot[0], foot[1]); ctx.stroke();
    ctx.strokeStyle = L.silk1; ctx.lineWidth = 18;
    ctx.beginPath(); ctx.moveTo(hip[0], hip[1]); ctx.lineTo(sh[0], sh[1]); ctx.stroke();
    ctx.strokeStyle = L.silk2; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(hip[0] + 4, hip[1] - 2); ctx.lineTo(sh[0] + 2, sh[1] - 1); ctx.stroke();
    const pump = Math.sin(TAU * p) * 5 * run;
    const elbow = [sh[0] + 10, sh[1] + 16];
    const hand = [sh[0] + 28 + pump, sh[1] + 12 - pump * 0.3];
    ctx.strokeStyle = L.silk2; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(sh[0], sh[1]); ctx.lineTo(elbow[0], elbow[1]); ctx.lineTo(hand[0], hand[1]); ctx.stroke();
    ctx.strokeStyle = L.rein || 'rgba(20,14,10,.9)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(hand[0], hand[1]); ctx.lineTo(mouth[0], mouth[1]); ctx.stroke();
    ctx.fillStyle = L.skin || '#5a3a26';
    ctx.beginPath(); ctx.arc(head[0], head[1], 8.5, 0, TAU); ctx.fill();
    ctx.fillStyle = L.cap;
    ctx.beginPath(); ctx.arc(head[0], head[1] - 1, 9.5, Math.PI, TAU); ctx.fill();
    ctx.fillRect(head[0], head[1] - 2, 13, 3);
    ctx.fillStyle = 'rgba(20,20,24,.85)';
    ctx.fillRect(head[0] + 2, head[1] + 1, 7, 3);
    leg(-38, -74, 0.1, false, true);
    leg(40, -74, 0.56, true, true);
    ctx.restore();
    return hooves;
  }

  kick(S, hooves, G, rate, o) {
    if (S.dt <= 0 || S.hs < 150) return;
    for (let i = 0; i < hooves.length; i++) {
      const h = hooves[i];
      if (h[1] > G - 12 && Math.random() < rate * S.dt) this.emit(h[0], G - 4, o.n || 1, o);
    }
  }

}
</script>
