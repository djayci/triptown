<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Saira:wght@500;600;700&display=swap">
  <style>
    body { margin: 0; background: #0b1220; }
    a { color: #facc15; } a:hover { color: #e2e8f0; }
  </style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#0b1220;font-family:'Saira','Helvetica Neue',Arial,sans-serif;color:#e2e8f0">
  <canvas id="scene" width="780" height="1688" style="position:absolute;left:0;top:0;width:390px;height:844px;display:block"></canvas>
  <div style="position:absolute;left:0;right:0;top:0;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 4px;background:linear-gradient(180deg, rgba(0,0,0,.6), rgba(0,0,0,0));font-size:12px;color:#ffffff">
    <div style="display:flex;align-items:center;gap:2px"><div style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6"></path><path d="M12 7.5v.01"></path></svg></div><span style="font-weight:600">Rules</span></div>
    <div style="display:flex;align-items:center;gap:18px">
      <div style="display:flex;flex-direction:column;align-items:flex-end;line-height:1.2"><span style="font-size:10px;letter-spacing:.12em;opacity:.7">SESSION</span><span style="font-weight:700;font-variant-numeric:tabular-nums">{{clock}}</span></div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;line-height:1.2"><span style="font-size:10px;letter-spacing:.12em;opacity:.7">NET</span><span style="font-weight:700;font-variant-numeric:tabular-nums">{{net}}</span></div>
    </div>
  </div>
  <div style="position:absolute;left:22px;right:0;top:66px;display:flex;justify-content:flex-start">
    <div style="display:flex;align-items:baseline;font-family:'Saira Condensed','Arial Narrow',sans-serif;font-weight:800;font-size:118px;line-height:1;color:#facc15;text-shadow:0 4px 30px rgba(0,0,0,.6);opacity:{{multOpacity}};transform:scale({{multScale}});font-variant-numeric:tabular-nums">
      <span style="font-size:61px;margin-right:4px">x</span><span>{{mult}}</span>
    </div>
  </div>
  <div style="position:absolute;left:24px;right:0;top:202px;display:flex;justify-content:flex-start;gap:12px;font-size:12px;font-weight:700;letter-spacing:.16em;opacity:.85"><span>NIGHT GALLOP · {{race}}</span><span style="color:#facc15">{{nextLabel}}</span></div>
  <sc-if value="{{showBanner}}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:24px;right:24px;top:290px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px;background:{{bannerBg}};color:{{bannerFg}};border-radius:2px">
      <span style="font-family:'Saira Condensed','Arial Narrow',sans-serif;font-weight:800;font-size:38px;line-height:1;text-align:center">{{banner}}</span>
      <span style="font-size:14px;font-weight:600;text-align:center">{{bannerSub}}</span>
    </div>
  </sc-if>
  <div style="position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:10px;padding:40px 16px 16px;background:linear-gradient(180deg, rgba(6,9,14,0) 0%, rgba(6,9,14,.92) 22%)">
    <div style="display:flex;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.14em;opacity:.8"><span>{{fenceLabel}}</span><span>STAKE ₦500 · MEDIUM</span></div>
    <div style="display:grid;grid-template-columns:repeat(5, minmax(0, 1fr));gap:6px">
      <sc-for list="{{ladder}}" as="step" hint-placeholder-count="5">
        <div style="display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;background:{{step.bg}};color:{{step.fg}};border:1.5px solid {{step.border}};border-radius:2px">
          <span style="font-size:10px;font-weight:700;letter-spacing:.08em;opacity:.8">{{step.label}}</span>
          <span style="font-size:14px;font-weight:700;font-variant-numeric:tabular-nums">{{step.value}}</span>
        </div>
      </sc-for>
    </div>
    <div style="display:grid;grid-template-columns:repeat(5, minmax(0, 1fr));gap:8px">
      <div style="grid-column:span 2;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1.5px solid #e2e8f0;border-radius:2px;opacity:{{collectOpacity}}">
        <span style="font-family:'Saira Condensed','Arial Narrow',sans-serif;font-weight:800;font-size:19px;line-height:1">{{collectTop}}</span>
        <span style="font-size:12px;font-weight:700;font-variant-numeric:tabular-nums">{{collectSub}}</span>
      </div>
      <div style="grid-column:span 3;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:{{jumpBg}};color:{{jumpFg}};border-radius:2px">
        <span style="font-family:'Saira Condensed','Arial Narrow',sans-serif;font-weight:800;font-size:26px;line-height:1">{{jumpTop}}</span>
        <span style="font-size:12px;font-weight:700;opacity:.85;font-variant-numeric:tabular-nums">{{jumpSub}}</span>
      </div>
    </div>
    <span style="font-size:11px;text-align:center;opacity:.55">18+ · RTP 97% · Every fence is decided when the round starts</span>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844},"reducedMotion":{"editor":"boolean","default":false}}'>
class Component extends DCLogic {
  cfg() {
    return {
      horseX: 330,
      hud: {
        accent: '#facc15', onAccent: '#111302', idleBg: 'rgba(250,204,21,.1)', idleFg: '#fef08a', lossBg: 'rgba(6,9,14,.92)', lossFg: '#e2e8f0',
        ladder: { done: { bg: 'rgba(250,204,21,.85)', fg: '#111302', border: '#facc15' }, next: { bg: '#f8fafc', fg: '#111302', border: '#f8fafc' }, todo: { bg: 'rgba(6,9,14,.6)', fg: '#cbd5e1', border: 'rgba(226,232,240,.25)' } },
      },
    };
  }

  drawScene(ctx, S) {
    const W = S.W, H = S.H, G = 1200;
    let gr = ctx.createLinearGradient(0, 0, 0, 1100);
    gr.addColorStop(0, '#0b1220'); gr.addColorStop(1, '#27313f');
    ctx.fillStyle = gr; ctx.fillRect(-40, -40, W + 80, H + 80);
    if (S.punch > 0.7) { ctx.fillStyle = 'rgba(220,235,255,' + (S.punch - 0.7) * 1.4 + ')'; ctx.fillRect(-40, -40, W + 80, H + 80); }
    this.tile(S, 0.2, 360, (x) => {
      ctx.fillStyle = '#1a2230'; ctx.fillRect(x + 40, 330, 12, 700);
      ctx.fillStyle = '#fffbe6'; ctx.fillRect(x, 300, 92, 34);
      const hg = ctx.createRadialGradient(x + 46, 316, 6, x + 46, 316, 220);
      hg.addColorStop(0, 'rgba(255,250,220,.6)'); hg.addColorStop(1, 'rgba(255,250,220,0)');
      ctx.fillStyle = hg; ctx.fillRect(x - 180, 100, 460, 440);
    });
    ctx.fillStyle = '#141b26'; ctx.fillRect(-40, 930, W + 80, 110);
    ctx.fillStyle = '#e2e8f0'; ctx.fillRect(-40, 1036, W + 80, 9);
    gr = ctx.createLinearGradient(0, 1045, 0, H);
    gr.addColorStop(0, '#4a3b2c'); gr.addColorStop(1, '#120d09');
    ctx.fillStyle = gr; ctx.fillRect(-40, 1045, W + 80, H);
    this.tile(S, 1, 140, (x, i) => { ctx.fillStyle = 'rgba(255,250,220,.08)'; ctx.fillRect(x, 1100 + this.rnd(i) * 500, 60 + this.rnd(i * 2) * 80, 5); });
    this.speedLines(ctx, S, '#cbd5e1', 18, 1060, 1600, 160);
    this.eachFence(S, (x, i) => {
      if (i === 10) { ctx.fillStyle = '#facc15'; ctx.fillRect(x - 9, 660, 18, 560); ctx.fillStyle = '#111302'; ctx.fillRect(x - 9, 660, 18, 60); return; }
      const shake = i === S.fence && S.result === 'refuse' ? Math.sin(S.t * 60) * 9 * S.shake : 0;
      ctx.save(); ctx.translate(x + shake, 0);
      ctx.fillStyle = '#1f2b1a'; ctx.beginPath(); ctx.ellipse(0, G - 70, 95, 90, 0, Math.PI, 0); ctx.fill(); ctx.fillRect(-95, G - 72, 190, 78);
      ctx.strokeStyle = '#34462a'; ctx.lineWidth = 4;
      for (let b = 0; b < 14; b++) { ctx.beginPath(); ctx.moveTo(-85 + b * 13, G); ctx.lineTo(-90 + b * 13 + this.rnd(b + i) * 20, G - 150 - this.rnd(b * 3 + i) * 30); ctx.stroke(); }
      ctx.fillStyle = '#facc15'; ctx.font = '800 30px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('x' + (0.97 / Math.pow(0.8, i + 1)).toFixed(2), 0, G - 205);
      ctx.restore();
    });
    const hv = this.jumpingHorse(ctx, S, { body: '#10151c', far: '#0a0e13', mane: '#05070a', rim: '#e2e8f0', silk1: '#facc15', silk2: '#111302', cap: '#111302', skin: '#3e271b', breeches: '#e2e8f0' }, G, 2.4);
    this.kick(S, hv, G, 80, { n: S.reduced ? 1 : 4, color: '#3b2a1b', alpha: 0.95, r: 7, life: 0.8, spread: 340, lift: 760, vx: -160, grav: 1800, world: 0.6, square: true });
    if (S.punch > 0.95) this.emit(S.hx + 60, G - 6, S.reduced ? 5 : 26, { color: '#4a3524', alpha: 0.95, r: 9, life: 0.9, spread: 640, lift: 620, grav: 1600, world: 0.5, square: true });
    this.drawParts(ctx, S);
    const drops = S.reduced ? 40 : 180;
    ctx.strokeStyle = 'rgba(200,215,235,.33)'; ctx.lineWidth = 2; ctx.beginPath();
    for (let i = 0; i < drops; i++) {
      const y = ((this.rnd(i) * H + S.t * 2100) % (H + 200)) - 100;
      const x = ((this.rnd(i * 3) * (W + 400) - S.scroll * 0.9 - y * 0.35) % (W + 400) + (W + 400)) % (W + 400) - 200;
      ctx.moveTo(x, y); ctx.lineTo(x - 30, y + 44);
    }
    ctx.stroke();
  }

  // ---- Fence Run: a step game. Each JUMP is one decision; every fence's result is fixed at round start. ----

  componentDidMount() {
    const c = this.cfg();
    this.M = [];
    for (let i = 1; i <= 10; i++) this.M.push(0.97 / Math.pow(0.8, i));
    this.g = {
      round: 0, phase: 'bet', pt: 0, t: 0, fence: 0, wx: -900, from: -900, speed: 0, gait: 0, parts: [], flash: 0, punch: 0,
      net: 0, clock: 1394, hudT: 1, raceNo: 41, result: null, jumpY: 0, jumpRot: 0, shake: 0, frozen: false,
    };
    this.last = 0;
    this.hudKey = '';
    const step = (now) => {
      this.raf = requestAnimationFrame(step);
      if (!this.cv || !this.cv.isConnected) this.cv = document.getElementById('scene');
      if (!this.cv) return;
      const dt = this.last ? Math.min(0.05, (now - this.last) / 1000) : 0.016;
      this.last = now;
      this.tick(dt);
      this.paint(this.cv.getContext('2d'));
    };
    this.raf = requestAnimationFrame(step);
  }

  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
  }

  naira(v) {
    return '₦' + Math.round(Math.abs(v)).toLocaleString('en-NG');
  }

  get SPACING() { return 1000; }

  fenceX(i) { return 900 + i * this.SPACING; }

  tick(dt) {
    const c = this.cfg();
    const g = this.g;
    const R = [{ jumps: 4, end: 'collect' }, { jumps: 2, end: 'refuse' }, { jumps: 10, end: 'finish' }];
    const r = R[g.round % R.length];
    const STAKE = 500, GAP = 2.2, APPROACH = 0.7, JUMP = 0.72, DECIDE = r.end === 'finish' ? 0.35 : 0.85, RES = 2.3;
    g.t += dt; g.pt += dt; g.clock += dt;
    g.flash = Math.max(0, g.flash - dt * 2.4);
    g.punch = Math.max(0, g.punch - dt * 2.5);
    g.shake = Math.max(0, g.shake - dt * 3);
    const targetX = (i) => this.fenceX(i) - 330;
    let speed = 0;
    if (g.phase === 'bet') {
      speed = 180;
      g.wx += speed * dt;
      if (g.pt >= GAP) { g.phase = 'approach'; g.pt = 0; g.net -= STAKE; g.raceNo++; g.fence = 0; g.from = g.wx; }
    } else if (g.phase === 'approach') {
      const from = g.fence === 0 ? g.from : this.fenceX(g.fence - 1) + 330;
      const to = targetX(g.fence);
      const u = Math.min(1, g.pt / APPROACH);
      g.wx = from + (to - from) * u;
      speed = (to - from) / APPROACH;
      if (u >= 1) {
        const refuse = r.end === 'refuse' && g.fence === r.jumps;
        g.phase = refuse ? 'refuse' : 'jump'; g.pt = 0;
        if (refuse) g.shake = 1;
      }
    } else if (g.phase === 'jump') {
      const u = Math.min(1, g.pt / JUMP);
      g.wx = targetX(g.fence) + 660 * u;
      speed = 660 / JUMP;
      g.jumpY = Math.sin(Math.PI * u) * 230;
      g.jumpRot = Math.sin(Math.PI * 2 * u) * -0.12;
      if (u >= 1) {
        g.jumpY = 0; g.jumpRot = 0; g.fence++; g.punch = 1; g.pt = 0;
        if (g.fence >= 10) { g.phase = 'finishRun'; }
        else if (r.end === 'collect' && g.fence === r.jumps) { g.phase = 'decide'; g.collectAfter = true; }
        else { g.phase = 'decide'; g.collectAfter = false; }
      }
    } else if (g.phase === 'decide') {
      speed = 0;
      if (g.pt >= DECIDE) {
        g.pt = 0;
        if (g.collectAfter) { g.phase = 'result'; g.result = 'collect'; g.flash = this.props.reducedMotion ? 0.3 : 1; g.net += Math.round(STAKE * this.M[g.fence - 1]); }
        else g.phase = 'approach';
      }
    } else if (g.phase === 'refuse') {
      speed = Math.max(0, 300 * (1 - g.pt * 2));
      g.wx += speed * dt;
      if (g.pt >= 0.9) { g.phase = 'result'; g.result = 'refuse'; g.pt = 0; }
    } else if (g.phase === 'finishRun') {
      speed = 900;
      g.wx += speed * dt;
      if (g.pt >= 0.9) { g.phase = 'result'; g.result = 'finish'; g.pt = 0; g.flash = this.props.reducedMotion ? 0.3 : 1; g.net += Math.round(STAKE * this.M[9]); }
    } else if (g.phase === 'result') {
      speed = g.result === 'refuse' ? 0 : 160;
      g.wx += speed * dt;
      if (g.pt >= RES) { g.phase = 'bet'; g.pt = 0; g.round++; g.result = null; g.fence = 0; g.wx = -900; if (g.round % 3 === 0) g.net = 0; }
    }
    g.speed += (speed - g.speed) * Math.min(1, dt * 10);
    const running = g.phase === 'approach' || g.phase === 'jump' || g.phase === 'finishRun';
    g.gait += dt * (g.phase === 'jump' ? 0 : running ? 2.4 : g.speed > 30 ? 1.2 : 0.2);
    g.hudT += dt;
    if (g.hudT > 0.05) { g.hudT = 0; this.pushHud(); }
  }

  pushHud() {
    const g = this.g;
    const H = this.cfg().hud;
    const STAKE = 500;
    const n = {};
    const cleared = g.fence;
    const cur = cleared > 0 ? this.M[cleared - 1] : 1;
    const next = cleared < 10 ? this.M[cleared] : null;
    n.mult = cur.toFixed(2);
    n.multDim = g.phase === 'bet';
    n.multOpacity = g.phase === 'bet' ? 0.5 : 1;
    n.multScale = (1 + 0.1 * g.punch).toFixed(3);
    n.fenceLabel = g.phase === 'bet' ? '10 FENCES · MEDIUM' : g.fence >= 10 ? 'FINISH LINE' : 'FENCE ' + Math.min(10, cleared + 1) + ' OF 10';
    n.nextLabel = next ? 'NEXT x' + next.toFixed(2) : 'FINISH x' + this.M[9].toFixed(2);
    n.race = 'ROUND ' + g.raceNo;
    const s = Math.floor(g.clock);
    n.clock = String(Math.floor(s / 3600)).padStart(2, '0') + ':' + String(Math.floor(s / 60) % 60).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    n.net = (g.net > 0 ? '+' : g.net < 0 ? '−' : '') + this.naira(g.net);
    const start = Math.max(0, Math.min(5, cleared - 1));
    n.ladder = [];
    for (let i = start; i < start + 5; i++) {
      const state = i < cleared ? 'done' : i === cleared ? 'next' : 'todo';
      const sty = H.ladder[state];
      n.ladder.push({ label: i === 9 ? 'FINISH' : 'F' + (i + 1), value: 'x' + this.M[i].toFixed(2), bg: sty.bg, fg: sty.fg, border: sty.border });
    }
    const deciding = g.phase === 'decide' || (g.phase === 'bet');
    n.showBanner = g.phase === 'result';
    n.bannerWin = g.result === 'collect' || g.result === 'finish';
    if (g.phase === 'bet') {
      n.jumpTop = 'BET ' + this.naira(STAKE); n.jumpSub = 'Round starts in ' + Math.max(1, Math.ceil(2.2 - g.pt)) + 's';
      n.jumpBg = H.idleBg; n.jumpFg = H.idleFg;
      n.collectTop = 'COLLECT'; n.collectSub = '—'; n.collectOpacity = 0.35;
    } else if (g.phase === 'result') {
      n.jumpTop = 'BET ' + this.naira(STAKE); n.jumpSub = 'Next round soon'; n.jumpBg = H.idleBg; n.jumpFg = H.idleFg;
      n.collectTop = 'COLLECT'; n.collectSub = '—'; n.collectOpacity = 0.35;
    } else {
      const canDecide = g.phase === 'decide';
      n.jumpTop = next ? 'JUMP' : 'FINISH'; n.jumpSub = next ? 'to x' + next.toFixed(2) : '';
      n.jumpBg = canDecide ? H.accent : H.idleBg; n.jumpFg = canDecide ? H.onAccent : H.idleFg;
      n.collectTop = 'COLLECT'; n.collectSub = cleared > 0 ? this.naira(STAKE * cur) : '—';
      n.collectOpacity = canDecide && cleared > 0 ? 1 : 0.35;
    }
    if (g.result === 'refuse') {
      n.banner = 'REFUSED'; n.bannerSub = 'Fence ' + (g.fence + 1) + ' · Stake ' + this.naira(STAKE) + ' lost';
    } else if (g.result === 'finish') {
      n.banner = 'FINISH · WIN ' + this.naira(STAKE * this.M[9]); n.bannerSub = 'Top prize x' + this.M[9].toFixed(2) + ' · Net +' + this.naira(STAKE * this.M[9] - STAKE);
    } else if (g.result === 'collect') {
      n.banner = 'WIN ' + this.naira(STAKE * cur); n.bannerSub = 'Collected at fence ' + cleared + ' · Net +' + this.naira(STAKE * cur - STAKE);
    }
    n.bannerBg = n.bannerWin ? H.accent : H.lossBg;
    n.bannerFg = n.bannerWin ? H.onAccent : H.lossFg;
    void deciding;
    const key = JSON.stringify(n);
    if (key !== this.hudKey) { this.hudKey = key; this.setState(n); }
  }

  renderVals() {
    const H = this.cfg().hud;
    const ladder = [1, 2, 3, 4, 5].map((i) => ({ label: 'F' + i, value: 'x' + (0.97 / Math.pow(0.8, i)).toFixed(2), bg: H.ladder.todo.bg, fg: H.ladder.todo.fg, border: H.ladder.todo.border }));
    return Object.assign({
      mult: '1.00', multOpacity: 0.5, multScale: '1', fenceLabel: '10 FENCES · MEDIUM', nextLabel: 'NEXT x1.21', race: 'ROUND 41',
      clock: '00:23:14', net: '₦0', ladder,
      jumpTop: 'BET ₦500', jumpSub: 'Round starts in 2s', jumpBg: H.idleBg, jumpFg: H.idleFg,
      collectTop: 'COLLECT', collectSub: '—', collectOpacity: 0.35,
      showBanner: false, banner: '', bannerSub: '', bannerBg: H.lossBg, bannerFg: H.lossFg,
    }, this.state || {});
  }

  paint(ctx) {
    const g = this.g;
    const c = this.cfg();
    const W = 780, H = 1688;
    const reduced = !!this.props.reducedMotion;
    const running = g.phase === 'approach' || g.phase === 'jump' || g.phase === 'finishRun';
    const k = Math.min(1, g.fence / 10);
    const S = {
      W, H, t: g.t, dt: 1 / 60, phase: running ? 'run' : g.phase === 'refuse' || g.result === 'refuse' ? 'crash' : 'bet',
      pt: g.pt, k, speed: g.speed, hs: running ? 900 : g.speed * 2, scroll: g.wx, gait: g.gait, hx: c.horseX || 330,
      reduced, frozen: false, punch: g.punch, flash: g.flash, fence: g.fence, jumpY: g.jumpY, jumpRot: g.jumpRot,
      jumping: g.phase === 'jump', result: g.result, shake: g.shake, gamePhase: g.phase,
    };
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    if (!reduced && (g.punch > 0 || g.shake > 0)) {
      const a = g.punch * 10 + g.shake * 14;
      ctx.translate((Math.random() - 0.5) * a, (Math.random() - 0.5) * a);
    }
    const z = 1 + 0.05 * g.punch;
    ctx.translate(W / 2, H * 0.6); ctx.scale(z, z); ctx.translate(-W / 2, -H * 0.6);
    this.drawScene(ctx, S);
    ctx.restore();
    if (g.flash > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + (g.flash * 0.7).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  /** Fences visible on screen: world x -> screen x. */
  eachFence(S, fn) {
    for (let i = 0; i < 10; i++) {
      const sx = S.hx + (this.fenceX(i) - S.scroll);
      if (sx > -300 && sx < S.W + 300) fn(sx, i);
    }
    const fx = S.hx + (this.fenceX(9) + 1100 - S.scroll);
    if (fx > -300 && fx < S.W + 300) fn(fx, 10);
  }

  /** The horse with the jump arc and tilt applied. */
  jumpingHorse(ctx, S, look, G, scale) {
    ctx.save();
    const cx = S.hx, cy = G - 100 * scale;
    ctx.translate(0, -S.jumpY);
    ctx.translate(cx, cy); ctx.rotate(S.jumpRot); ctx.translate(-cx, -cy);
    const s2 = Object.assign({}, S, S.jumping ? { gait: 0.3, hs: 900 } : {});
    const hv = this.horse(ctx, s2, look, G, scale);
    ctx.restore();
    return S.jumping ? [] : hv;
  }

  speedLines(ctx, S, color, count, yMin, yMax, lenBase) {
    const n = Math.floor(count * Math.min(1, S.speed / 1000));
    ctx.fillStyle = color;
    for (let i = 0; i < n; i++) {
      const seed = i * 17.3;
      const y = yMin + this.rnd(seed) * (yMax - yMin);
      const len = lenBase * (0.5 + this.rnd(seed * 2));
      const span = S.W + len;
      const x = ((this.rnd(seed * 3) * span - S.scroll * (1.6 + this.rnd(seed) * 1.2)) % span + span) % span - len;
      ctx.globalAlpha = 0.15 + 0.45 * this.rnd(seed * 5);
      ctx.fillRect(x, y, len, 2 + this.rnd(seed * 7) * 3);
    }
    ctx.globalAlpha = 1;
  }


  rnd(n) {
    const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }

  tile(S, f, sp, fn) {
    const off = S.scroll * f;
    const base = Math.floor(off / sp);
    const shift = off - base * sp;
    const count = Math.ceil(S.W / sp) + 2;
    for (let i = -1; i < count; i++) fn(i * sp - shift, base + i);
  }

  emit(x, y, n, o) {
    const P = this.g.parts;
    const cap = this.props.reducedMotion ? 120 : 320;
    for (let i = 0; i < n; i++) {
      if (P.length > cap) P.shift();
      P.push({
        x: x + (Math.random() - 0.5) * (o.jx || 20), y,
        vx: (o.vx || 0) + (Math.random() - 0.5) * (o.spread || 80),
        vy: (o.vy || 0) - Math.random() * (o.lift || 80),
        life: 0, max: (o.life || 1) * (0.6 + Math.random() * 0.8),
        r: (o.r || 10) * (0.5 + Math.random()), grow: o.grow || 0, grav: o.grav || 0,
        color: o.color, alpha: o.alpha == null ? 0.6 : o.alpha, world: o.world == null ? 1 : o.world,
        sq: !!o.square,
      });
    }
  }

  drawParts(ctx, S) {
    const P = this.g.parts;
    for (let i = P.length - 1; i >= 0; i--) {
      const p = P[i];
      if (S.dt > 0) {
        p.life += S.dt;
        p.vy += p.grav * S.dt;
        p.x += (p.vx - S.speed * p.world) * S.dt;
        p.y += p.vy * S.dt;
      }
      if (p.life >= p.max) { P.splice(i, 1); continue; }
      ctx.globalAlpha = Math.max(0, p.alpha * (1 - p.life / p.max));
      ctx.fillStyle = p.color;
      const rr = p.r + p.grow * p.life;
      if (p.sq) { ctx.fillRect(p.x - rr, p.y - rr, rr * 2, rr * 2); }
      else { ctx.beginPath(); ctx.arc(p.x, p.y, rr, 0, 6.2832); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
  }

  // Placeholder gallop: production art is pre-rendered 3D sprite sheets.
  horse(ctx, S, L, G, s, opt) {
    opt = opt || {};
    const TAU = Math.PI * 2;
    const p = S.gait;
    const run = Math.min(1, S.hs / 520);
    const bob = -Math.abs(Math.sin(TAU * p)) * 7 * run;
    const pitch = Math.sin(TAU * p + 0.8) * 0.045 * run;
    const upright = S.phase === 'run' ? 0 : S.phase === 'crash' ? 1 - Math.min(1, S.hs / 700) : S.phase === 'collect' ? 0.55 : 0.35;
    const hooves = [];
    ctx.save();
    ctx.translate(S.hx, G);
    if (opt.mirror) { ctx.scale(s, -s); ctx.globalAlpha = opt.alpha; }
    else ctx.scale(s, s);
    ctx.translate(0, bob);
    ctx.rotate(pitch);
    const amp = 0.18 + 0.5 * run;
    const leg = (hx, hy, ph, front, near) => {
      const th = TAU * (p + ph);
      const a = amp * Math.sin(th);
      const fold = Math.max(0, Math.cos(th)) * (front ? 1.5 : 1.0) * (0.3 + 0.7 * run);
      const kx = hx + Math.sin(a) * 36, ky = hy + Math.cos(a) * 36;
      const a2 = a - fold;
      const fx = kx + Math.sin(a2) * 40, fy = ky + Math.cos(a2) * 40;
      ctx.strokeStyle = near ? L.body : (L.far || L.body);
      ctx.lineCap = 'round';
      ctx.lineWidth = near ? (front ? 12 : 15) : (front ? 10 : 13);
      ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(kx, ky); ctx.stroke();
      ctx.lineWidth = near ? 7 : 6;
      ctx.beginPath(); ctx.moveTo(kx, ky); ctx.lineTo(fx, fy); ctx.stroke();
      ctx.fillStyle = L.hoof || L.body;
      ctx.beginPath(); ctx.arc(fx, fy + 1, 5, 0, TAU); ctx.fill();
      hooves.push([S.hx + s * fx, G + s * (fy + bob)]);
    };
    leg(-38, -74, 0.0, false, false);
    leg(40, -74, 0.44, true, false);
    // tail
    const tw = Math.sin(TAU * p) * 8 * run;
    ctx.strokeStyle = L.mane || L.body;
    ctx.lineCap = 'round';
    ctx.lineWidth = 10;
    ctx.beginPath(); ctx.moveTo(-60, -98); ctx.quadraticCurveTo(-98, -104 + tw, -128, -72 - run * 22 + tw); ctx.stroke();
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(-62, -94); ctx.quadraticCurveTo(-104, -94 + tw, -136, -58 - run * 16 + tw * 1.4); ctx.stroke();
    // body
    ctx.fillStyle = L.body;
    ctx.beginPath(); ctx.ellipse(0, -88, 60, 22, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-36, -92, 31, 27, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(38, -90, 29, 26, 0, 0, TAU); ctx.fill();
    // neck + head
    const r1 = -0.95 + 0.4 * run + Math.sin(TAU * p + 1.6) * 0.09 * run;
    const r2 = 0.95 - 0.25 * run;
    ctx.save();
    ctx.translate(46, -98);
    ctx.rotate(r1);
    ctx.beginPath(); ctx.moveTo(-8, -18); ctx.lineTo(62, -10); ctx.lineTo(66, 10); ctx.lineTo(-4, 24); ctx.closePath(); ctx.fill();
    if (L.mane) {
      ctx.strokeStyle = L.mane; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(-6, -18); ctx.quadraticCurveTo(30, -20 - 5 * run, 60, -12); ctx.stroke();
    }
    ctx.translate(62, 0);
    ctx.rotate(r2);
    ctx.beginPath(); ctx.ellipse(20, 0, 27, 11, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(42, 2, 9, 9, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, -8); ctx.lineTo(4, -24); ctx.lineTo(11, -9); ctx.closePath(); ctx.fill();
    ctx.restore();
    // mouth point in body frame, for the reins
    const c1 = Math.cos(r1), s1 = Math.sin(r1);
    const hx0 = 46 + 62 * c1, hy0 = -98 + 62 * s1;
    const c2 = Math.cos(r1 + r2), s2 = Math.sin(r1 + r2);
    const mouth = [hx0 + 40 * c2 - 3 * s2, hy0 + 40 * s2 + 3 * c2];
    if (L.rim && !opt.mirror) {
      ctx.strokeStyle = L.rim; ctx.lineWidth = 3; ctx.globalAlpha = 0.75;
      ctx.beginPath(); ctx.ellipse(0, -90, 60, 22, 0, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(-36, -94, 31, 27, 0, Math.PI * 1.1, Math.PI * 1.7); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    // jockey (adult proportions: small head, long torso, clear riding kit)
    const jb = -bob * 0.6;
    const hip = [4, -118 + jb];
    const sh = [40 - 22 * upright, -130 - 26 * upright + jb];
    const head = [sh[0] + 12 - 6 * upright, sh[1] - 11 - 3 * upright];
    const knee = [26, -106 + jb * 0.5];
    const foot = [16, -92];
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = L.breeches || '#f1ede4'; ctx.lineWidth = 11;
    ctx.beginPath(); ctx.moveTo(hip[0], hip[1]); ctx.lineTo(knee[0], knee[1]); ctx.stroke();
    ctx.strokeStyle = L.boot || '#141414'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(knee[0], knee[1]); ctx.lineTo(foot[0], foot[1]); ctx.stroke();
    ctx.strokeStyle = L.silk1; ctx.lineWidth = 18;
    ctx.beginPath(); ctx.moveTo(hip[0], hip[1]); ctx.lineTo(sh[0], sh[1]); ctx.stroke();
    ctx.strokeStyle = L.silk2; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(hip[0] + 4, hip[1] - 2); ctx.lineTo(sh[0] + 2, sh[1] - 1); ctx.stroke();
    const pump = Math.sin(TAU * p) * 5 * run;
    const elbow = [sh[0] + 10, sh[1] + 16];
    const hand = [sh[0] + 28 + pump, sh[1] + 12 - pump * 0.3];
    ctx.strokeStyle = L.silk2; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(sh[0], sh[1]); ctx.lineTo(elbow[0], elbow[1]); ctx.lineTo(hand[0], hand[1]); ctx.stroke();
    ctx.strokeStyle = L.rein || 'rgba(20,14,10,.9)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(hand[0], hand[1]); ctx.lineTo(mouth[0], mouth[1]); ctx.stroke();
    ctx.fillStyle = L.skin || '#5a3a26';
    ctx.beginPath(); ctx.arc(head[0], head[1], 8.5, 0, TAU); ctx.fill();
    ctx.fillStyle = L.cap;
    ctx.beginPath(); ctx.arc(head[0], head[1] - 1, 9.5, Math.PI, TAU); ctx.fill();
    ctx.fillRect(head[0], head[1] - 2, 13, 3);
    ctx.fillStyle = 'rgba(20,20,24,.85)';
    ctx.fillRect(head[0] + 2, head[1] + 1, 7, 3);
    leg(-38, -74, 0.1, false, true);
    leg(40, -74, 0.56, true, true);
    ctx.restore();
    return hooves;
  }

  kick(S, hooves, G, rate, o) {
    if (S.dt <= 0 || S.hs < 150) return;
    for (let i = 0; i < hooves.length; i++) {
      const h = hooves[i];
      if (h[1] > G - 12 && Math.random() < rate * S.dt) this.emit(h[0], G - 4, o.n || 1, o);
    }
  }

}
</script>
