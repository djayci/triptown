function lamp(sg, z) {
  const g = new THREE.Group(); g.position.set(sg * 4.6, 0.15, z); scene.add(g);
  add(cyl(0.07, 0.1, 4.6), '#3a3048', { p: [0, 2.3, 0], parent: g });
  add(cyl(0.05, 0.05, 1.3), '#3a3048', { p: [-sg * 0.6, 4.55, 0], r: [0, 0, Math.PI / 2], parent: g });
  add(sphere(0.2), S.lampLight, { p: [-sg * 1.2, 4.4, 0], parent: g, emissive: true });
}
let hi = 0;
for (const sg of [-1, 1]) for (let z = sg > 0 ? -4 : -11; z > -330; z -= 12 + Math.random() * 9) { house(sg, z, S.houses[hi++ % S.houses.length]); if (hi % 2) tree(sg, z - 8); }

for (const sg of [-1, 1]) for (let z = sg > 0 ? -18 : -32; z > -300; z -= 32) lamp(sg, z);
for (const [x, z] of (S.night ? [[-4.6, -32], [4.6, -18], [4.6, -50], [-4.6, -64], [4.6, -82], [-4.6, -96]] : [[-4.6, -32], [4.6, -18], [4.6, -50]])) { const pl = new THREE.PointLight(S.lampLight, S.night ? 45 : 12, S.night ? 18 : 14, 1.5); pl.position.set(x * 0.74, 4.2, z); scene.add(pl); }
if (S.night) { const hl = new THREE.PointLight('#fff0d0', 6, 9, 1.4); hl.position.set(0.75, 1.3, -3.2); scene.add(hl); for (let i = 0; i < 45; i++) { const st = new THREE.Mesh(new THREE.SphereGeometry(0.9 + Math.random() * 0.8, 6, 4), new THREE.MeshBasicMaterial({ color: '#ffffff', fog: false })); const a = Math.random() * Math.PI - Math.PI / 2, e = 0.45 + Math.random() * 0.6; st.position.set(Math.sin(a) * 800 * Math.cos(e), Math.sin(e) * 800, -Math.cos(a) * 800 * Math.cos(e)); scene.add(st); } }

/* ---------- courier on a delivery moped (adult, ~7.5 heads) ---------- */
const R = new THREE.Group(); scene.add(R);
const fallen = STATE === 'wipeout';
if (!fallen) { R.position.set(0.8, 0.3, -2.2); R.rotation.set(0, -0.02, STATE === 'splash' ? 0.1 : 0); }
const M = new THREE.Group(); R.add(M);
if (fallen) { M.position.set(-0.4, 0.62, -9); M.rotation.set(0.2, 0.7, 1.45); scene.add(M); }
const tire = (z, r) => { add(new THREE.TorusGeometry(r, 0.09, 8, 18), S.tire, { p: [0, r + 0.02, z], r: [0, Math.PI / 2, 0], parent: M }); add(cyl(r * 0.55, r * 0.55, 0.12, 10), '#9a9aa4', { p: [0, r + 0.02, z], r: [0, 0, Math.PI / 2], parent: M }); };
tire(0.62, 0.24); tire(-0.62, 0.24);
// body shell, floorboard, front fork and handlebars
add(new THREE.BoxGeometry(0.46, 0.34, 0.9), S.bike, { p: [0, 0.52, 0.28], parent: M });
add(new THREE.BoxGeometry(0.4, 0.08, 0.5), '#2a2a30', { p: [0, 0.3, -0.22], parent: M });
add(new THREE.BoxGeometry(0.4, 0.62, 0.14), S.bike, { p: [0, 0.62, -0.5], r: [-0.25, 0, 0], parent: M });
limb([0, 0.4, -0.62], [0, 1.08, -0.52], 0.035, '#6a6a74', M);
limb([-0.34, 1.12, -0.5], [0.34, 1.12, -0.5], 0.022, '#2a2a30', M);
for (const sx of [-1, 1]) { limb([sx * 0.3, 1.12, -0.5], [sx * 0.38, 1.36, -0.46], 0.012, '#2a2a30', M); add(new THREE.BoxGeometry(0.12, 0.08, 0.02), '#9aa2b0', { p: [sx * 0.39, 1.4, -0.46], parent: M }); }
add(new THREE.BoxGeometry(0.44, 0.1, 0.62), '#1e1e22', { p: [0, 0.74, 0.3], parent: M });
add(new THREE.BoxGeometry(0.3, 0.08, 0.04), '#ff3a3a', { p: [0, 0.6, 0.74], parent: M, emissive: true });
// rear rack delivery box with the unthrown papers
add(new THREE.BoxGeometry(0.44, 0.26, 0.4), '#d9d4c8', { p: [0, 0.92, 0.78], parent: M });
add(new THREE.BoxGeometry(0.46, 0.04, 0.42), '#b8b2a4', { p: [0, 1.06, 0.78], parent: M });
add(new THREE.BoxGeometry(0.4, 0.05, 0.02), '#e0a82e', { p: [0, 0.92, 0.985], parent: M });
for (let k = 0; k < Math.min(ROLLS, 5); k++) {
  const pg = new THREE.Group(); pg.position.set(-0.14 + k * 0.07, 1.08, 0.74); pg.rotation.set(Math.PI / 2, 0, 0); M.add(pg);
  add(cyl(0.032, 0.032, 0.3, 8), '#ece6d8', { parent: pg }); add(cyl(0.034, 0.034, 0.03, 8), '#6a6f78', { parent: pg });
}
// rider: dark jacket and trousers, hi-vis vest with reflective bands, open-face helmet
const P = new THREE.Group(); if (!fallen) M.add(P); else { P.position.set(1.7, 0.3, -8.2); P.rotation.set(0, -2.3, 0); scene.add(P); }
const seatY = fallen ? 0 : 0.8;
const JK = S.hoodie, TR = S.jeans, HV = '#c9d84a';
if (!fallen) {
  limb([0.14, seatY + 0.08, 0.2], [0.18, 0.62, -0.18], 0.075, TR, P); limb([0.18, 0.62, -0.18], [0.16, 0.34, -0.2], 0.065, TR, P);
  limb([-0.14, seatY + 0.08, 0.2], [-0.18, 0.62, -0.18], 0.075, TR, P); limb([-0.18, 0.62, -0.18], [-0.16, 0.34, -0.2], 0.065, TR, P);
  add(new THREE.BoxGeometry(0.12, 0.08, 0.28), '#1c1c20', { p: [0.16, 0.36, -0.26], parent: P }); add(new THREE.BoxGeometry(0.12, 0.08, 0.28), '#1c1c20', { p: [-0.16, 0.36, -0.26], parent: P });
} else {
  limb([0.14, 0.12, 0], [0.2, 0.12, -0.7], 0.075, TR, P); limb([-0.14, 0.12, 0], [-0.3, 0.3, -0.55], 0.075, TR, P);
}
const torsoBase = fallen ? 0.2 : seatY + 0.12;
add(new THREE.BoxGeometry(0.42, 0.26, 0.26), TR, { p: [0, torsoBase + 0.08, 0.16], parent: P });
const torso = add(capsule(0.19, 0.46), JK, { p: [0, torsoBase + 0.44, 0.06], r: [fallen ? 0.35 : -0.28, 0, 0], s: [1.15, 1, 0.8], parent: P });
add(capsule(0.2, 0.34), HV, { p: [0, torsoBase + 0.46, 0.08], r: [fallen ? 0.35 : -0.28, 0, 0], s: [1.2, 1, 0.84], parent: P });
for (const dy of [0.36, 0.56]) add(new THREE.BoxGeometry(0.5, 0.035, 0.36), '#e8eef2', { p: [0, torsoBase + dy, 0.09 + (fallen ? -0.05 : 0.03)], r: [fallen ? 0.35 : -0.28, 0, 0], parent: P, emissive: true });
if (!fallen) { limb([0.24, torsoBase + 0.64, -0.02], [0.32, 1.12, -0.5], 0.055, JK, P); limb([-0.24, torsoBase + 0.64, -0.02], [-0.32, 1.12, -0.5], 0.055, JK, P); }
else { limb([0.24, torsoBase + 0.6, 0.1], [0.42, 0.14, 0.4], 0.055, JK, P); limb([-0.24, torsoBase + 0.6, 0.1], [-0.3, 0.9, -0.1], 0.055, JK, P); }
const headY = torsoBase + 0.9, headZ = fallen ? 0.22 : -0.1;
add(cyl(0.06, 0.07, 0.12, 8), S.skin, { p: [0, headY - 0.14, headZ + 0.02], parent: P });
add(new THREE.SphereGeometry(0.105, 10, 8), S.skin, { p: [0, headY, headZ], s: [0.9, 1.08, 1], parent: P });
add(new THREE.SphereGeometry(0.128, 12, 8, 0, Math.PI * 2, 0, Math.PI * 0.62), S.helmet, { p: [0, headY + 0.02, headZ + 0.01], parent: P });
add(new THREE.BoxGeometry(0.2, 0.03, 0.08), '#9aa2b0', { p: [0, headY + 0.1, headZ + 0.1], parent: P });
if (fallen) { add(new THREE.SphereGeometry(0.11, 8, 6), '#2e241e', { p: [0.04, headY - 0.06, headZ - 0.06], s: [1, 0.5, 1], parent: P }); }
// splash: puddle and spray at the rear wheel, only in the setback frame
if (STATE === 'splash') {
  add(new THREE.CylinderGeometry(0.75, 0.75, 0.01, 20), '#4c5864', { p: [0.8, 0.165, -1.7], s: [1, 1, 1.6], cast: false, outline: false, rough: 0.15 });
  for (let k = 0; k < 90; k++) {
    const a = Math.random() * Math.PI * 2, rr = 0.2 + Math.random() * 0.9, h = 0.1 + Math.random() * 0.9;
    add(new THREE.IcosahedronGeometry(0.012 + Math.random() * 0.02, 0), '#d8e6ee', { p: [0.8 + Math.cos(a) * rr, 0.2 + h, -1.6 + Math.sin(a) * rr * 0.5], cast: false, outline: false, emissive: true });
  }
}
// wipeout: papers scattered on the road, no slapstick
if (fallen) {
  for (const [x, z, r] of [[-1.2, -6.5, 0.4], [0.6, -7.2, 1.2], [1.4, -10.5, 2.1]]) { const g = new THREE.Group(); g.position.set(x, 0.22, z); g.rotation.set(Math.PI / 2, r, 0); scene.add(g); add(cyl(0.045, 0.045, 0.34, 8), '#ece6d8', { parent: g }); }
}
/* ---------- render ---------- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W * DPR, H * DPR), S.bloom, 0.4, 0.95));
composer.addPass(new OutputPass());
composer.render();
document.title = 'done';
</script>
